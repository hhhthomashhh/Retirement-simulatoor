<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BC Retirement Decision Simulator v3.8</title><style>html,body{margin:0;height:100%;background:#08111f;color:#edf4ff;font-family:system-ui,sans-serif}.load{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.spin{font-size:42px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="load"><div><div class="spin">🍁</div><h2>Loading Retirement Simulator…</h2></div></div><script>(async()=>{try{const names=['assets/v38b-00.txt','assets/v38b-01.txt','assets/v38b-02.txt','assets/v38b-03.txt','assets/v38b-04.txt','assets/v38b-05.txt'];const parts=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n);return r.text()})));const b64=parts.join('').trim();const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><div><h2>Unable to load the Retirement Simulator</h2><p>Please refresh the page in a current version of Safari, Chrome, Edge, or Firefox.</p></div></div>';console.error(e)}})();</script></body></html>
